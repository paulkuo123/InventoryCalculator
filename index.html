<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>莉莉安蝦皮庫存管理系統</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <div class="header-content">
            <div class="logo-container">
                <div class="logo-circle">
                    <i class="fas fa-store"></i>
                </div>
                <h1>莉莉安蝦皮庫存管理系統</h1>
            </div>
            <div class="header-actions">
                <div class="stats-badge">
                    <i class="fas fa-chart-line"></i>
                    <span>庫存監控中</span>
                </div>
            </div>
        </div>
        <div class="header-wave">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 100">
                <path fill="#ffffff" fill-opacity="1" d="M0,64L48,69.3C96,75,192,85,288,80C384,75,480,53,576,48C672,43,768,53,864,58.7C960,64,1056,64,1152,56C1248,48,1344,32,1392,24L1440,16L1440,100L1392,100C1344,100,1248,100,1152,100C1056,100,960,100,864,100C768,100,672,100,576,100C480,100,384,100,288,100C192,100,96,100,48,100L0,100Z"></path>
            </svg>
        </div>
    </header>

    <div class="container">
        <div class="card">
            <div class="search-container">
                <input type="text" id="searchInput" placeholder="輸入商品關鍵字...">
                <div class="headless-option">
                    <label class="toggle-switch">
                        <input type="checkbox" id="headlessMode">
                        <span class="toggle-slider"></span>
                    </label>
                    <span>顯示瀏覽器</span>
                </div>
                <div class="filter-option">
                    <label class="toggle-switch">
                        <input type="checkbox" id="filterMode">
                        <span class="toggle-slider"></span>
                    </label>
                    <span>僅顯示需補貨型號</span>
                </div>
                <div class="filter-option">
                    <label for="inventoryMonth"><i class="fas fa-filter"></i> 庫存月份:</label>
                    <select id="inventoryMonth">
                        <option value="1">1個月</option>
                        <option value="2">2個月</option>
                        <option value="3">3個月</option>
                        <option value="4" selected>4個月</option>
                        <option value="5">5個月</option>
                        <option value="6">6個月</option>
                        <option value="7">7個月</option>
                        <option value="8">8個月</option>
                        <option value="9">9個月</option>
                        <option value="10">10個月</option>
                    </select>
                </div>
                <button id="searchButton" class="btn-primary">
                    <i class="fas fa-search"></i>
                    搜尋
                </button>
            </div>
        </div>

        <div id="loading" class="loading card">
            <div class="spinner-container">
                <div class="spinner"></div>
                <div class="spinner-inner"></div>
            </div>
            <h3 class="status-message">正在爬取資料，請稍候...</h3>
            <div class="progress-container">
                <div id="progressBar" class="progress-bar"></div>
            </div>
            <div id="progressText" class="progress-text">0%</div>
            <p id="statusMessage" class="status-message">初始化爬蟲...</p>
            <p>這可能需要幾分鐘時間，取決於商品數量</p>
        </div>
        
        <div class="table-container">
            <table class="product-list" id="productTable">
                <thead>
                    <tr>
                        <th>商品</th>
                        <th>已售出</th>
                        <th>型號數量</th>
                    </tr>
                </thead>
                <tbody id="productList">
                    <!-- 商品資料將在這裡動態生成 -->
                </tbody>
            </table>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
