<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>莉莉安蝦皮庫存管理系統</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <div class="header-content">
            <div class="logo-container">
                <div class="logo-circle">
                    <i class="fas fa-store"></i>
                </div>
                <h1>莉莉安蝦皮庫存管理系統</h1>
            </div>
            <div class="header-actions">
                <button id="togglePieChartBtn" class="chart-toggle-btn">
                    <i class="fas fa-chart-pie"></i>
                    <span>庫存分析</span>
                </button>
                <div class="stats-badge">
                    <i class="fas fa-chart-line"></i>
                    <span>庫存監控中</span>
                </div>
            </div>
        </div>
        <div class="header-wave">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 100">
                <path fill="#ffffff" fill-opacity="1" d="M0,64L48,69.3C96,75,192,85,288,80C384,75,480,53,576,48C672,43,768,53,864,58.7C960,64,1056,64,1152,56C1248,48,1344,32,1392,24L1440,16L1440,100L1392,100C1344,100,1248,100,1152,100C1056,100,960,100,864,100C768,100,672,100,576,100C480,100,384,100,288,100C192,100,96,100,48,100L0,100Z"></path>
            </svg>
        </div>
    </header>

    <div class="container">
        <div class="card">
            <div class="search-container">
                <input type="text" id="searchInput" placeholder="輸入商品關鍵字...">
                <div class="headless-option">
                    <label class="toggle-switch">
                        <input type="checkbox" id="headlessMode" checked>
                        <span class="toggle-slider"></span>
                    </label>
                    <span>顯示瀏覽器</span>
                </div>
                <div class="filter-option">
                    <label for="inventoryMonth"><i class="fas fa-filter"></i> 庫存月份:</label>
                    <select id="inventoryMonth">
                        <option value="1">1個月</option>
                        <option value="2">2個月</option>
                        <option value="3">3個月</option>
                        <option value="4" selected>4個月</option>
                        <option value="5">5個月</option>
                        <option value="6">6個月</option>
                        <option value="7">7個月</option>
                        <option value="8">8個月</option>
                        <option value="9">9個月</option>
                        <option value="10">10個月</option>
                    </select>
                </div>
                <div class="filter-option">
                    <label class="toggle-switch">
                        <input type="checkbox" id="filterMode">
                        <span class="toggle-slider"></span>
                    </label>
                    <span>僅顯示需補貨型號</span>
                </div>
                <button id="searchButton" class="btn-primary">
                    <i class="fas fa-search"></i>
                    搜尋
                </button>
            </div>
        </div>

        <!-- 整體庫存水位圓餅圖區塊 -->
        <div class="card" id="inventoryPieChartCard" style="display: none;">
            <div class="pie-chart-container">
                <div class="chart-header">
                    <div class="chart-title">
                        <i class="fas fa-chart-pie"></i>
                        <h3>整體庫存水位分析</h3>
                    </div>
                    <div class="chart-subtitle">基於目前顯示的商品統計</div>
                    <button id="closePieChartBtn" class="close-chart-btn">
                        <i class="fas fa-times"></i>
                    </button>
                </div>
                
                <div class="chart-content">
                    <div class="pie-chart-wrapper">
                        <div class="pie-chart" id="inventoryPieChart">
                            <div class="pie-slice" id="pieSlice1"></div>
                            <div class="pie-slice" id="pieSlice2"></div>
                            <div class="pie-center">
                                <div class="center-value" id="centerValue">0</div>
                                <div class="center-label">個月</div>
                            </div>
                        </div>
                        <div class="chart-legend">
                            <div class="legend-item">
                                <div class="legend-color" style="background: #4CAF50;"></div>
                                <span>庫存充足 (>6個月)</span>
                            </div>
                            <div class="legend-item">
                                <div class="legend-color" style="background: #FF9800;"></div>
                                <span>庫存正常 (3-6個月)</span>
                            </div>
                            <div class="legend-item">
                                <div class="legend-color" style="background: #F44336;"></div>
                                <span>庫存不足 (<3個月)</span>
                            </div>
                        </div>
                    </div>
                    
                    <div class="stats-panel">
                        <div class="stat-card">
                            <div class="stat-icon">
                                <i class="fas fa-boxes"></i>
                            </div>
                            <div class="stat-content">
                                <div class="stat-number" id="totalProductsCount">0</div>
                                <div class="stat-label">顯示商品</div>
                            </div>
                        </div>
                        
                        <div class="stat-card">
                            <div class="stat-icon">
                                <i class="fas fa-layer-group"></i>
                            </div>
                            <div class="stat-content">
                                <div class="stat-number" id="totalModelsCount">0</div>
                                <div class="stat-label">型號總數</div>
                            </div>
                        </div>
                        
                        <div class="stat-card">
                            <div class="stat-icon">
                                <i class="fas fa-warehouse"></i>
                            </div>
                            <div class="stat-content">
                                <div class="stat-number" id="totalStockCount">0</div>
                                <div class="stat-label">總庫存</div>
                            </div>
                        </div>
                        
                        <div class="stat-card">
                            <div class="stat-icon">
                                <i class="fas fa-chart-line"></i>
                            </div>
                            <div class="stat-content">
                                <div class="stat-number" id="totalSalesCount">0</div>
                                <div class="stat-label">總月銷量</div>
                            </div>
                        </div>
                    </div>
                </div>
                
                <div class="analysis-panel">
                    <div class="analysis-item">
                        <span class="analysis-label">平均庫存水位:</span>
                        <span class="analysis-value" id="avgInventoryLevel">0 個月</span>
                    </div>
                    <div class="analysis-item">
                        <span class="analysis-label">庫存標準差:</span>
                        <span class="analysis-value" id="inventoryStdDev">0 個月</span>
                    </div>
                    <div class="analysis-item">
                        <span class="analysis-label">最低庫存水位:</span>
                        <span class="analysis-value" id="minInventoryLevel">0 個月</span>
                    </div>
                    <div class="analysis-item">
                        <span class="analysis-label">最高庫存水位:</span>
                        <span class="analysis-value" id="maxInventoryLevel">0 個月</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- 進階搜尋區塊 -->
        <div class="card" id="advancedSearchCard" style="display: none;">
            <div class="search-container">
                <div class="filter-info">
                    <i class="fas fa-filter"></i>
                    <span>進階篩選</span>
                </div>
                <input type="text" id="advancedSearchInput" placeholder="輸入關鍵字...">
                <div class="filter-option search-option">
                    <span>搜尋範圍:</span>
                    <div class="radio-group">
                        <label>
                            <input type="radio" name="searchOption" id="searchOptionProduct" value="product" checked>
                            <span>商品名稱</span>
                        </label>
                        <label>
                            <input type="radio" name="searchOption" id="searchOptionModel" value="model">
                            <span>型號名稱</span>
                        </label>
                        <label>
                            <input type="radio" name="searchOption" id="searchOptionBoth" value="both">
                            <span>全部</span>
                        </label>
                    </div>
                </div>
                <div class="button-group">
                    <button id="advancedSearchButton" class="btn-secondary">
                        <i class="fas fa-search-plus"></i>
                        篩選
                    </button>
                    <button id="clearAdvancedSearchButton" class="btn-outline">
                        <i class="fas fa-times"></i>
                        清除篩選
                    </button>
                </div>
            </div>
        </div>

        <div id="loading" class="loading card">
            <div class="spinner-container">
                <div class="spinner"></div>
                <div class="spinner-inner"></div>
            </div>
            <h3 class="status-message">正在爬取資料，請稍候...</h3>
            <div class="progress-container">
                <div id="progressBar" class="progress-bar"></div>
            </div>
            <div id="progressText" class="progress-text">0%</div>
            <p id="statusMessage" class="status-message">初始化爬蟲...</p>
            <p>這可能需要幾分鐘時間，取決於商品數量</p>
        </div>
        
        <div class="table-container">
            <table class="product-list" id="productTable">
                <thead>
                    <tr>
                        <th>商品</th>
                        <th>已售出</th>
                        <th>總月銷量</th>
                        <th>型號數量</th>
                    </tr>
                </thead>
                <tbody id="productList">
                    <!-- 商品資料將在這裡動態生成 -->
                </tbody>
            </table>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
