<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>莉莉安蝦皮庫存管理系統</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <div class="header-content">
            <div class="logo-container">
                <div class="logo-circle">
                    <i class="fas fa-store"></i>
                </div>
                <h1>莉莉安蝦皮庫存管理系統</h1>
            </div>
            <div class="header-actions">
                <a class="btn-secondary header-link-button" href="/inbound.html">
                    <i class="fas fa-box-open"></i>
                    到貨入庫
                </a>
                <a class="btn-secondary header-link-button" href="/ads.html">
                    <i class="fas fa-bullhorn"></i>
                    前往廣告分析
                </a>
                <div class="stats-badge">
                    <i class="fas fa-chart-line"></i>
                    <span>庫存監控中</span>
                </div>
            </div>
        </div>
        <div class="header-wave">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 100">
                <path fill="#ffffff" fill-opacity="1" d="M0,64L48,69.3C96,75,192,85,288,80C384,75,480,53,576,48C672,43,768,53,864,58.7C960,64,1056,64,1152,56C1248,48,1344,32,1392,24L1440,16L1440,100L1392,100C1344,100,1248,100,1152,100C1056,100,960,100,864,100C768,100,672,100,576,100C480,100,384,100,288,100C192,100,96,100,48,100L0,100Z"></path>
            </svg>
        </div>
    </header>

    <div class="container">
        <div class="card">
            <div class="search-container">
                <input type="text" id="searchInput" placeholder="輸入商品關鍵字...">
                <div class="headless-option">
                    <label class="toggle-switch">
                        <input type="checkbox" id="headlessMode" checked>
                        <span class="toggle-slider"></span>
                    </label>
                    <span>顯示瀏覽器</span>
                </div>
                <div class="filter-option">
                    <label for="inventoryMonth"><i class="fas fa-filter"></i> 庫存月份:</label>
                    <select id="inventoryMonth">
                        <option value="1">1個月</option>
                        <option value="2">2個月</option>
                        <option value="3">3個月</option>
                        <option value="4" selected>4個月</option>
                        <option value="5">5個月</option>
                        <option value="6">6個月</option>
                        <option value="7">7個月</option>
                        <option value="8">8個月</option>
                        <option value="9">9個月</option>
                        <option value="10">10個月</option>
                    </select>
                </div>
                <div class="filter-option">
                    <label class="toggle-switch">
                        <input type="checkbox" id="filterMode">
                        <span class="toggle-slider"></span>
                    </label>
                    <span>僅顯示需補貨型號</span>
                </div>
                <button id="searchButton" class="btn-primary">
                    <i class="fas fa-search"></i>
                    搜尋
                </button>
            </div>
        </div>

        <!-- 整體庫存水位圓餅圖區塊 -->
        <!-- 庫存健康儀表板 (Dashboard Summary) -->
        <div class="card dashboard-summary" id="dashboardSummary">
            <div class="dashboard-header">
                <i class="fas fa-heartbeat"></i>
                <h3>整體庫存狀態</h3>
            </div>
            <div class="dashboard-content">
                <!-- 狀態指示器 -->
                <div class="dashboard-status-card" id="overallStatusCard">
                    <div class="status-icon-wrapper">
                        <i class="fas fa-check-circle" id="statusIcon"></i>
                    </div>
                    <div class="status-info">
                        <div class="status-title">目前狀態</div>
                        <div class="status-value" id="overallStatusText">健康</div>
                        <div class="status-desc" id="overallStatusDesc">平均庫存足夠支撐 3 個月以上</div>
                    </div>
                </div>

                <!-- 關鍵指標 -->
                <div class="dashboard-metrics">
                    <div class="metric-item">
                        <div class="metric-icon alert-icon">
                            <i class="fas fa-exclamation-triangle"></i>
                        </div>
                        <div class="metric-info">
                            <div class="metric-value text-danger" id="restockModelsCount">0</div>
                            <div class="metric-label" id="restockModelsLabel">需補貨 / 共 0 型號</div>
                        </div>
                    </div>
                    
                    <div class="metric-item">
                        <div class="metric-icon info-icon">
                            <i class="fas fa-chart-line"></i>
                        </div>
                        <div class="metric-info">
                            <div class="metric-value" id="dashboardTotalSales">0</div>
                            <div class="metric-label">總月銷量</div>
                        </div>
                    </div>

                    <div class="metric-item">
                        <div class="metric-icon success-icon">
                            <i class="fas fa-box-open"></i>
                        </div>
                        <div class="metric-info">
                            <div class="metric-value" id="dashboardTotalStock">0</div>
                            <div class="metric-label">總庫存量</div>
                        </div>
                    </div>

                    <div class="metric-item">
                        <div class="metric-icon" id="avgLevelIconWrapper">
                            <i class="fas fa-calendar-alt"></i>
                        </div>
                        <div class="metric-info">
                            <div class="metric-value" id="dashboardAvgLevel">-</div>
                            <div class="metric-label">平均庫存水位</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 進階搜尋區塊 -->
        <div class="card" id="advancedSearchCard" style="display: none;">
            <div class="search-container">
                <div class="filter-info">
                    <i class="fas fa-filter"></i>
                    <span>進階篩選</span>
                </div>
                <input type="text" id="advancedSearchInput" placeholder="輸入關鍵字...">
                <div class="filter-option search-option">
                    <span>搜尋範圍:</span>
                    <div class="radio-group">
                        <label>
                            <input type="radio" name="searchOption" id="searchOptionProduct" value="product" checked>
                            <span>商品名稱</span>
                        </label>
                        <label>
                            <input type="radio" name="searchOption" id="searchOptionModel" value="model">
                            <span>型號名稱</span>
                        </label>
                        <label>
                            <input type="radio" name="searchOption" id="searchOptionBoth" value="both">
                            <span>全部</span>
                        </label>
                    </div>
                </div>
                <div class="button-group">
                    <button id="advancedSearchButton" class="btn-secondary">
                        <i class="fas fa-search-plus"></i>
                        篩選
                    </button>
                    <button id="clearAdvancedSearchButton" class="btn-outline">
                        <i class="fas fa-times"></i>
                        清除篩選
                    </button>
                </div>
            </div>
        </div>

        <div id="loading" class="loading card">
            <div class="spinner-container">
                <div class="spinner"></div>
                <div class="spinner-inner"></div>
            </div>
            <h3 class="status-message">正在爬取資料，請稍候...</h3>
            <div class="progress-container">
                <div id="progressBar" class="progress-bar"></div>
            </div>
            <div id="progressText" class="progress-text">0%</div>
            <p id="statusMessage" class="status-message">初始化爬蟲...</p>
            <p>這可能需要幾分鐘時間，取決於商品數量</p>
        </div>
        
        <div class="table-container">
            <table class="product-list" id="productTable">
                <thead>
                    <tr>
                        <th>狀態</th>
                        <th>商品</th>
                        <th>已售出</th>
                        <th>總月銷量</th>
                        <th>型號數量</th>
                    </tr>
                </thead>
                <tbody id="productList">
                    <!-- 商品資料將在這裡動態生成 -->
                </tbody>
            </table>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
