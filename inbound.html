<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1688 到貨入庫｜莉莉安庫存系統</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="inbound.css">
</head>
<body>
    <header class="topbar">
        <div class="topbar-inner">
            <div class="brand">
                <span class="brand-icon"><i class="fas fa-box-open"></i></span>
                <div>
                    <h1>1688 到貨入庫</h1>
                    <p>對照蝦皮商品與規格，把倉庫實收數量加回庫存。</p>
                </div>
            </div>
            <a href="/" class="button ghost"><i class="fas fa-arrow-left"></i> 返回庫存首頁</a>
        </div>
    </header>

    <main>
        <section class="status-strip" id="systemStatus">
            <span class="status-dot"></span>
            <div>
                <strong>正在檢查入庫狀態</strong>
                <p>請稍候</p>
            </div>
        </section>

        <section class="panel import-panel">
            <div class="section-heading">
                <span class="step">1</span>
                <div>
                    <h2>讀取 1688 訂單</h2>
                    <p>貼上訂單編號或訂單詳情連結；需要登入時會開啟瀏覽器等待處理。</p>
                </div>
            </div>
            <div class="inline-form">
                <input id="orderReference" type="text" placeholder="1688 訂單編號或 https://trade.1688.com/...">
                <button id="importOrderButton" class="button primary">
                    <i class="fas fa-file-import"></i> 讀取訂單
                </button>
            </div>
            <div id="jobStatus" class="job-status hidden"></div>
        </section>

        <section class="panel hidden" id="orderPanel">
            <div class="section-heading">
                <span class="step">2</span>
                <div>
                    <h2>確認到貨商品</h2>
                    <p id="orderSummary"></p>
                </div>
            </div>
            <div id="openReceipts" class="open-receipts hidden"></div>
            <div class="notice warning hidden" id="mappingNotice"></div>
            <div id="orderLines" class="order-lines"></div>
            <div class="panel-actions">
                <span id="receiptValidation" class="validation-message"></span>
                <button id="createReceiptButton" class="button primary">
                    <i class="fas fa-layer-group"></i> 整張訂單入庫預覽
                </button>
            </div>
        </section>

        <section class="panel hidden" id="receiptPanel">
            <div class="section-heading">
                <span class="step">3</span>
                <div>
                    <h2>預覽並更新蝦皮庫存</h2>
                    <p id="receiptSummary"></p>
                </div>
            </div>
            <div id="receiptNotice" class="notice"></div>
            <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>1688 規格</th>
                            <th>蝦皮商品／規格</th>
                            <th>增加</th>
                            <th>目前庫存</th>
                            <th>更新後</th>
                            <th>狀態</th>
                        </tr>
                    </thead>
                    <tbody id="previewRows"></tbody>
                </table>
            </div>
            <div class="panel-actions">
                <button id="previewButton" class="button secondary">
                    <i class="fas fa-eye"></i> 讀取即時庫存
                </button>
                <button id="applyButton" class="button danger" disabled>
                    <i class="fas fa-cloud-arrow-up"></i> 確認並更新蝦皮
                </button>
            </div>
        </section>
    </main>

    <template id="allocationTemplate">
        <div class="allocation-row">
            <div class="allocation-copy"></div>
            <label>分配數量 <input class="allocation-qty" type="number" min="0"></label>
            <button class="icon-button remove-allocation" title="移除此對照"><i class="fas fa-times"></i></button>
        </div>
    </template>

    <script src="inbound.js"></script>
</body>
</html>
